---
name: build
run-name: "🐳 Build ${{ github.ref_name }}"

# What a tag publishes: the image, the chart, and the GitHub Release carrying
# the binaries, whose notes are the changelog's newest entry. release.yaml cuts
# the final tags this runs on, and prerelease.yaml the prerelease ones.

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # A tag must name the version the changelog's newest entry names, or a
  # prerelease of it: anything else has no notes to publish.
  plan:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.plan.outputs.version }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      notes: ${{ steps.changelog.outputs.notes }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - id: changelog
        uses: mikluko/action-changelog@v1
        with:
          # A prerelease is cut before its entry is dated.
          "off": undated-entry

      - id: plan
        env:
          TAG: ${{ github.ref_name }}
          NEWEST: ${{ steps.changelog.outputs.version }}
        run: |
          if [ -z "$NEWEST" ]; then
            echo "::error::CHANGELOG.md's newest entry names no version"
            exit 1
          fi
          version=${TAG#v}
          case "$version" in
            "$NEWEST") prerelease=false ;;
            "$NEWEST"-*) prerelease=true ;;
            *)
              echo "::error::tag $TAG is not the version CHANGELOG.md's newest entry names, $NEWEST"
              exit 1
              ;;
          esac
          echo "version=$version" >>"$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >>"$GITHUB_OUTPUT"

  container:
    needs: [plan]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - uses: ko-build/setup-ko@v0.10

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        env:
          VERSION: ${{ needs.plan.outputs.version }}
          PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: |
          tags=$VERSION
          [ "$PRERELEASE" = true ] || tags="$tags,latest"
          make image TAGS="$tags"

  chart:
    needs: [container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: azure/setup-helm@v5

      - name: Log in to GHCR
        env:
          ACTOR: ${{ github.actor }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: printf '%s' "$TOKEN" | helm registry login ghcr.io --username "$ACTOR" --password-stdin

      - name: Package and push chart
        run: make package

  # Last, so a release exists only once every artifact it names does.
  release:
    needs: [plan, container, chart]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Notes
        env:
          NOTES: ${{ needs.plan.outputs.notes }}
        run: printf '%s\n' "$NOTES" >"$RUNNER_TEMP/notes.md"

      - uses: goreleaser/goreleaser-action@v7
        with:
          version: "~> v2"
          args: release --clean --release-notes ${{ runner.temp }}/notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
