<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Uptime.com</title>
  <meta name="description" content="Ask your AI assistant about Uptime.com.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 15px;
      font-family: Roboto, system-ui, -apple-system, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #212529;
      background: linear-gradient(135.65deg, #266674 -1.67%, #235964 47.84%, #124856 103.19%) fixed;
    }
    .card {
      width: 100%;
      max-width: 560px;
      padding: 3rem 2rem;
      text-align: center;
      background: #fff;
      border-radius: 8px;
      box-shadow: 0 0 40px 0 rgba(0, 0, 0, 0.10);
    }
    .logo { display: flex; flex-direction: column; align-items: center; margin-bottom: 2rem; }
    .logo a { display: block; line-height: 0; }
    .logo .icon svg { width: 96px; height: auto; margin-bottom: 1rem; }
    .logo .wordmark svg { width: 240px; max-width: 100%; height: auto; }
    h1 { margin: 0 0 1.5rem; font-size: 1rem; font-weight: 400; color: #6c757d; }
    .agents {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(88px, 1fr));
      gap: .75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }
    .agents a {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: .5rem;
      padding: 1rem .5rem .75rem;
      font-size: .875rem;
      font-weight: 500;
      color: #495057;
      text-decoration: none;
      border: 1px solid #dee2e6;
      border-radius: 8px;
      transition: border-color .15s, box-shadow .15s, transform .15s;
    }
    .agents a:hover, .agents a:focus-visible {
      border-color: #00aa66;
      box-shadow: 0 4px 16px rgba(0, 170, 102, .15);
      transform: translateY(-2px);
      outline: none;
    }
    .agents svg { width: 36px; height: 36px; }
    .agents .mono svg { color: #000; }
    hr { margin: 2rem 1.5rem 1.5rem; border: 0; border-top: 1px solid #dee2e6; }
    h2 { margin: 0 0 1rem; font-size: 1rem; font-weight: 400; color: #6c757d; }
    .connect { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: .75rem; }
    .connect a {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: .5rem;
      padding: .5rem 1rem;
      font-weight: 500;
      color: #00aa66;
      text-decoration: none;
      border: 1px solid #00aa66;
      border-radius: 4px;
      transition: color .15s, background-color .15s;
    }
    .connect a:hover, .connect a:focus-visible { color: #fff; background-color: #00aa66; outline: none; }
    .connect svg { width: 18px; height: 18px; fill: currentColor; }
  </style>
</head>
